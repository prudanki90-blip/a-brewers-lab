name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin 
          java-version: '21'


          

    

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Prepare Capacitor Workspace
        run: |
          set -e

          mkdir -p www
          cp index.html www/
          cp engine.js www/
          cp database.js www/

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lab.molecularbrew",
            "appName": "Predictive Canvas",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Update Android Gradle Wrapper
        run: |
          set -e

          sed -i -E \
            's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.6-\1.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          cat android/gradle/wrapper/gradle-wrapper.properties
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: molecular-brew-canvas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
