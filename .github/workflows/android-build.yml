name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Restructure Assets & Initialize Capacitor Workspace
      run: |
        # 1. Create a clean distribution directory for web assets
        mkdir -p www
        
        # 2. Move your application source files into the isolated web folder
        cp index.html www/ 2>/dev/null || true
        cp engine.js www/ 2>/dev/null || true
        cp database.js www/ 2>/dev/null || true
        
        # 3. Initialize Node environment safely
        npm init -y
        
        # 4. Install production framework packages
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # 5. Generate high-fidelity capacitor config targeting the new www path
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.lab.molecularbrew",
          "appName": "Predictive Canvas",
          "webDir": "www"
        }
        EOF
        
        # 6. Execute native compilation scaffolding hooks
        npx cap add android
        npx cap sync android

    - name: Compile Unsigned Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload Finished APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: molecular-brew-canvas-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

